name: Java and retrieval evaluation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

  retrieval-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECDOCS_DB_URL: jdbc:postgresql://localhost:5433/secdocs
      SECDOCS_DB_USER: secdocs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create local database password
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "SECDOCS_DB_PASSWORD=$password" >> "$GITHUB_ENV"
          printf 'SECDOCS_DB_PASSWORD=%s\n' "$password" > .env
      - name: Start PostgreSQL and Ollama
        run: docker compose up -d --wait
      - name: Pull embedding model
        run: docker compose exec -T ollama ollama pull bge-m3:567m
      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Ingest, embed and check recall
        shell: bash
        run: |
          jar=target/secdocs-rag-0.0.1-SNAPSHOT.jar
          java -jar "$jar" --secdocs.ingest=true --spring.main.web-application-type=none
          java -jar "$jar" --secdocs.store=true --spring.main.web-application-type=none
          java -jar "$jar" --secdocs.embed=true --spring.main.web-application-type=none
          java -jar "$jar" --secdocs.eval=true --secdocs.min-recall=0.8 --spring.main.web-application-type=none
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-results
          path: evals/results.json
          if-no-files-found: ignore
