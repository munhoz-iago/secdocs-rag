name: Publish recorded demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build application with published snapshots
        run: chmod +x mvnw && ./mvnw -B -DskipTests package
      - name: Export static demonstration without database or model
        shell: bash
        run: |
          java -jar target/secdocs-rag-0.0.1-SNAPSHOT.jar > /tmp/secdocs-demo.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/status > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/export_demo.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v5.0.1
